<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232f7d4f'/><rect y='58' width='100' height='42' fill='%238a5a3b'/></svg>">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        {% for item in site.nav %}
          {% assign target = item.url | relative_url %}
          <a href="{{ target }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main id="main" class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>A small, friendly setup for running Minecraft servers at home.</p>
      <p>
        <a href="https://github.com/moggleif/mirabelle-minecraft">Project on GitHub</a>
        ·
        <a href="https://docs.craftycontrol.com/">Crafty Controller docs</a>
      </p>
    </footer>
  </body>
</html>
